services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: membot
      POSTGRES_USER: membot
      POSTGRES_PASSWORD: membot
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membot -d membot"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
